{% extends "base.html" %}
{% block content %}
<h1>Edit user</h1>
<form method="post">
  <label>Username <input name="username" value="{{ form.get('username', '') }}" required autofocus></label>
  <label>New password (leave blank to keep the current one)
    <input name="password" type="password" autocomplete="new-password"></label>
  <button type="submit">Save</button>
</form>
<p>Past entries in the activity log keep the name that was used at the time.</p>
<p><a role="button" class="secondary outline" href="{{ url_for('main.audit_log', person=user.id) }}">History</a></p>
<p><a href="{{ url_for('main.users') }}">Cancel</a>
  {% if user.id != current_user.id %}&nbsp;|&nbsp; <a href="{{ url_for('main.user_delete', user_id=user.id) }}">Delete this user</a>{% endif %}</p>
{% endblock %}
